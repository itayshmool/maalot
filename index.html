<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maalot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0d0b08;
      --fg: #f4ede0;
      --accent: #d4a259;
      --muted: #8a7f6b;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(circle at 50% 30%, #1a160f 0%, var(--bg) 70%);
      color: var(--fg);
      font-family: 'Inter', system-ui, sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }
    .stack { display: flex; flex-direction: column; gap: 1.5rem; align-items: center; }
    .mark {
      font-family: 'Fraunces', serif;
      font-weight: 800;
      font-size: clamp(3rem, 10vw, 6rem);
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .mark span { color: var(--accent); }
    .tagline {
      font-size: 1rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 300;
    }
    .divider {
      width: 60px;
      height: 1px;
      background: var(--accent);
      opacity: 0.7;
    }
    .note {
      font-family: 'Fraunces', serif;
      font-style: italic;
      color: var(--muted);
      font-size: 0.95rem;
      max-width: 32ch;
    }
  </style>
</head>
<body>
  <main class="stack">
    <h1 class="mark">Maalot<span>.</span></h1>
    <div class="divider"></div>
    <p class="tagline">Coming&nbsp;soon</p>
    <p class="note">A new chapter is being written.</p>
  </main>
</body>
</html>
